name: CI-CD

on:
  push:
    branches:
      - develop
      - 'feature/**'
      - master
  pull_request:
    branches:
      - develop
      - master

jobs:
  test-build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Enable Yarn
        run: corepack enable

      - name: Install dependencies
        run: yarn install

      - name: Run tests
        env:
          SQLITE_DB_LOCATION: /tmp/todo.db
          NODE_ENV: test
        run: yarn test

      - name: Set image tag
        id: vars
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/todoapp-ci-cd:${{ env.IMAGE_TAG }} .

      - name: Push Docker image
        if: github.event_name == 'push'
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/todoapp-ci-cd:${{ env.IMAGE_TAG }}