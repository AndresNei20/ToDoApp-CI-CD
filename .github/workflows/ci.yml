name: CI

on:
  push:
    branches:
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - develop
      - master

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Enable Yarn
        run: corepack enable

      - name: Install dependencies
        run: yarn install

      - name: Run tests
        env:
          SQLITE_DB_LOCATION: /tmp/todo.db
          NODE_ENV: test
        run: yarn test

      - name: Build Docker image
        run: docker build -t todoapp-ci:${{ github.sha }} .